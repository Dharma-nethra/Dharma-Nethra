<!DOCTYPE html>
<html lang="si">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dharma Nethra - Admin</title>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.6.1/firebase-database-compat.js"></script>
    <style>
        body { font-family: sans-serif; background: #fffbf2; padding: 20px; }
        .container { max-width: 600px; margin: auto; background: #fff; padding: 25px; border-radius: 15px; box-shadow: 0 5px 15px rgba(0,0,0,0.1); }
        input, textarea { width: 100%; padding: 12px; margin: 10px 0; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        button { width: 100%; padding: 15px; background: #d35400; color: #fff; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; }
        .list-item { background: #f9f9f9; padding: 10px; margin-top: 10px; border-radius: 8px; border: 1px solid #eee; }
        .list-item-title { font-weight: bold; margin-bottom: 8px; }
        .list-item-buttons { display: flex; gap: 5px; }
        .list-item-buttons button { width: auto; padding: 8px 15px; font-size: 14px; }
        .btn-edit { background: #3498db; }
        .btn-delete { background: #e74c3c; }
        .btn-cancel { background: #95a5a6; }
        #editMode { display: none; background: #fff3cd; padding: 15px; border-radius: 8px; margin-bottom: 15px; border: 2px solid #ffc107; }
    </style>
</head>
<body>

<div class="container">
    <h2 style="color:#d35400; text-align:center;">සදහම් ලිපි කළමනාකරණය</h2>
    
    <div id="editMode">
        <strong>🔄 සංස්කරණ මාදිලිය:</strong> <span id="editTitle"></span>
        <button onclick="cancelEdit()" class="btn-cancel" style="margin-top: 10px;">❌ සංස්කරණය අවලංගු කරන්න</button>
    </div>

    <input type="text" id="t" placeholder="මාතෘකාව...">
    <textarea id="c" rows="8" placeholder="ලිපිය මෙතැනට පේස්ට් කරන්න..."></textarea>
    
    <input type="text" id="pdfUrl" placeholder="PDF සබැඳිය (Google Drive Link) මෙතැනට පේස්ට් කරන්න...">
    
    <button id="saveBtn" onclick="save()">ඇප් එකට එක් කරන්න (Upload)</button>
    <p id="msg" style="text-align:center; font-weight:bold;"></p>

    <hr>
    <h3>📚 දැනට ඇති ලිපි ලැයිස්තුව</h3>
    <div id="article-list">පූරණය වෙමින් පවතී...</div>
</div>

<script>
    // Firebase Config
    const firebaseConfig = {
        apiKey: "AIzaSyDEiwhtAIdoqdMIV5n_bdDoKuIrCkjqr3M",
        authDomain: "dharma-nethra.firebaseapp.com",
        databaseURL: "https://dharma-nethra-default-rtdb.firebaseio.com",
        projectId: "dharma-nethra",
        storageBucket: "dharma-nethra.firebasestorage.app",
        messagingSenderId: "365410669829",
        appId: "1:365410669829:web:d9a9465ed1f1f2b792936c"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    // සංස්කරණය සඳහා වන global variable
    let editingArticleId = null;

    // ලිපිය සුරැකීම හෝ යාවත්කාලීන කරීම
    function save() {
        const title = document.getElementById('t').value;
        const content = document.getElementById('c').value;
        const pdf_link = document.getElementById('pdfUrl').value; // PDF Link එක ලබා ගැනීම
        const msg = document.getElementById('msg');

        if(title && content) {
            if(editingArticleId) {
                // යාවත්කාලීන කරීම (Update)
                db.ref('articles/' + editingArticleId).update({
                    title: title,
                    content: content,
                    pdf_link: pdf_link, // PDF යාවත්කාලීන කිරීම
                    time: Date.now()
                }).then(() => {
                    msg.style.color = "green";
                    msg.innerText = "✅ සාර්ථකව යාවත්කාලීන කළා!";
                    clearForm();
                }).catch(err => {
                    msg.style.color = "red";
                    msg.innerText = "❌ දෝෂයක්: " + err.message;
                });
            } else {
                // නව ලිපියක් එකතු කරීම (Add New)
                db.ref('articles').push({
                    title: title,
                    content: content,
                    pdf_link: pdf_link, // PDF ඇතුළත් කිරීම
                    time: Date.now()
                }).then(() => {
                    msg.style.color = "green";
                    msg.innerText = "✅ සාර්ථකව ඇතුළත් කළා!";
                    clearForm();
                }).catch(err => {
                    msg.style.color = "red";
                    msg.innerText = "❌ දෝෂයක්: " + err.message;
                });
            }
        } else { 
            alert("කරුණාකර මාතෘකාව සහ ලිපිය පුරවන්න."); 
        }
    }

    // සංස්කරණය කරන්න
    function editArticle(id) {
        const articleRef = db.ref('articles/' + id);
        articleRef.once('value').then((snapshot) => {
            const article = snapshot.val();
            if(article) {
                editingArticleId = id;
                document.getElementById('t').value = article.title;
                document.getElementById('c').value = article.content;
                // PDF ලින්ක් එක තිබේ නම් එය පෙන්නන්න, නැත්නම් හිස්ව තබන්න
                document.getElementById('pdfUrl').value = article.pdf_link ? article.pdf_link : "";
                
                document.getElementById('editMode').style.display = 'block';
                document.getElementById('editTitle').innerText = article.title;
                document.getElementById('saveBtn').innerText = '✏️ යාවත්කාලීන කරන්න (Update)';
                document.getElementById('saveBtn').style.background = '#27ae60';
                
                // ඉහළට scroll කරන්න
                window.scrollTo({ top: 0, behavior: 'smooth' });
            }
        });
    }

    // සංස්කරණය අවලංගු කරන්න
    function cancelEdit() {
        clearForm();
        document.getElementById('msg').innerText = '';
    }

    // ෆෝරම් එක clear කරන්න
    function clearForm() {
        editingArticleId = null;
        document.getElementById('t').value = "";
        document.getElementById('c').value = "";
        document.getElementById('pdfUrl').value = ""; // PDF කොටුව හිස් කිරීම
        document.getElementById('editMode').style.display = 'none';
        document.getElementById('saveBtn').innerText = 'ඇප් එකට එක් කරන්න (Upload)';
        document.getElementById('saveBtn').style.background = '#d35400';
    }

    // ලිපි ලැයිස්තුව පෙන්වීම
    db.ref('articles').on('value', (snap) => {
        const list = document.getElementById('article-list');
        list.innerHTML = '';
        if(snap.exists()) {
            snap.forEach(child => {
                const a = child.val();
                
                list.innerHTML += `
                    <div class="list-item">
                        <div class="list-item-title">${a.title}</div>
                        <div class="list-item-buttons">
                            <button onclick="editArticle('${child.key}')" class="btn-edit">✏️ සංස්කරණය</button>
                            <button onclick="del('${child.key}')" class="btn-delete">🗑️ මකන්න</button>
                        </div>
                    </div>
                `;
            });
        } else { 
            list.innerHTML = "තවමත් ලිපි කිසිවක් නැත."; 
        }
    }, err => {
        document.getElementById('article-list').innerText = "දෝෂයක්: " + err.message;
    });

    // මකා දැමීම
    function del(id) {
        if(confirm("මෙම ලිපිය මකා දැමීමට අවශ්‍යද?")) {
            db.ref('articles/' + id).remove();
        }
    }
</script>

</body>
</html>
